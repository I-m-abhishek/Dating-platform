# Test profile: in-memory H2, schema generated from the entities, Flyway off.
#
# This exists to smoke-test the Spring context, not the schema. Flyway is disabled because
# V1 is deliberately PostgreSQL-specific (pgcrypto, TIMESTAMPTZ, partial indexes, NULLS
# LAST) and a second H2-flavoured migration set would drift from the real one - which is
# worse than not testing it here. Schema correctness is enforced against a real PostgreSQL
# by `ddl-auto=validate` when the app starts for real.
spring.datasource.url=jdbc:h2:mem:dating;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

app.seed-demo-data=false
app.storage.provider=local
app.storage.local-root=./target/test-storage
app.storage.public-base-url=http://localhost:8080/api/v1/media/files
app.jwt.secret=dGVzdC1vbmx5LXNlY3JldC1hdC1sZWFzdC10aGlydHktdHdvLWJ5dGVzLWxvbmc=

logging.level.root=WARN
logging.level.com.dating.platform=INFO
logging.level.org.hibernate=WARN
