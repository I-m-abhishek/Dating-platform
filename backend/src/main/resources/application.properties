# ---- spring ----------------------------------------------------------
spring.application.name=dating-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=60MB

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Loads lazy collections/associations for a whole page of entities in one IN query
# instead of one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---- server ----------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

# ---- management ------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# ---- springdoc -------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ---- app: cors -------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ---- app: jwt --------------------------------------------------------
# OVERRIDE IN PRODUCTION. Must be >= 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
app.jwt.issuer=dating-platform
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d

# ---- app: storage ----------------------------------------------------
# local | s3
app.storage.provider=local
app.storage.local-root=${STORAGE_ROOT:./storage}
app.storage.public-base-url=${STORAGE_PUBLIC_URL:http://localhost:8080/api/v1/media/files}
# HEIC is deliberately absent. No browser renders it in an <img>, so it was already a
# broken upload path, and it is an ISO-BMFF container we cannot strip EXIF from - which
# would mean publishing the GPS position the photo was taken at. Re-add only alongside a
# server-side transcode.
app.storage.allowed-image-types=image/jpeg,image/png,image/webp
app.storage.allowed-attachment-types=image/jpeg,image/png,image/webp,image/gif,audio/mpeg,audio/mp4,audio/webm,video/mp4,application/pdf
# 10 MB
app.storage.max-image-bytes=10485760
# 25 MB
app.storage.max-attachment-bytes=26214400

# ---- app: matching ---------------------------------------------------
# every Monday 09:00
app.matching.weekly-auto-match-cron=0 0 9 * * MON
# every day 09:00
app.matching.daily-auto-match-cron=0 0 9 * * *
# every 6 hours
app.matching.standout-refresh-cron=0 0 */6 * * *
app.matching.candidate-pool-size=400
app.matching.max-distance-km-default=80
app.matching.min-compatibility-score=0.35

# ---- app: quota (-1 = unlimited) -------------------------------------
app.quota.free.photo-comments-per-day=5
app.quota.free.likes-per-day=20
app.quota.free.super-likes-per-day=1
app.quota.free.auto-match-per-week=1
app.quota.free.rewinds-per-day=0

app.quota.plus.photo-comments-per-day=25
app.quota.plus.likes-per-day=100
app.quota.plus.super-likes-per-day=5
app.quota.plus.auto-match-per-week=3
app.quota.plus.rewinds-per-day=5

app.quota.premium.photo-comments-per-day=100
app.quota.premium.likes-per-day=-1
app.quota.premium.super-likes-per-day=10
app.quota.premium.auto-match-per-day=1
app.quota.premium.rewinds-per-day=-1

# ---- app: chat -------------------------------------------------------
# A new match may send at most N messages before the other side replies.
app.chat.opener-message-limit=3
app.chat.max-message-length=2000

# ---- app: rate limit -------------------------------------------------
app.rate-limit.enabled=true
app.rate-limit.default-capacity=120
app.rate-limit.default-refill-period=1m

# ---- logging ---------------------------------------------------------
logging.level.root=INFO
logging.level.com.dating.platform=${APP_LOG_LEVEL:DEBUG}
