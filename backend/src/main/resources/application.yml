spring:
  application:
    name: dating-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 60MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
    allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed-headers: ["*"]
    allow-credentials: true
    max-age: 3600

  jwt:
    # OVERRIDE IN PRODUCTION. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
    issuer: dating-platform
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  storage:
    provider: local            # local | s3
    local-root: ${STORAGE_ROOT:./storage}
    public-base-url: ${STORAGE_PUBLIC_URL:http://localhost:8080/api/v1/media/files}
    allowed-image-types: [image/jpeg, image/png, image/webp, image/heic]
    allowed-attachment-types: [image/jpeg, image/png, image/webp, image/gif, audio/mpeg, audio/mp4, audio/webm, video/mp4, application/pdf]
    max-image-bytes: 10485760       # 10 MB
    max-attachment-bytes: 26214400  # 25 MB

  matching:
    weekly-auto-match-cron: "0 0 9 * * MON"       # every Monday 09:00
    daily-auto-match-cron: "0 0 9 * * *"          # every day 09:00
    standout-refresh-cron: "0 0 */6 * * *"        # every 6 hours
    candidate-pool-size: 400
    max-distance-km-default: 80
    min-compatibility-score: 0.35

  quota:
    free:
      photo-comments-per-day: 5
      likes-per-day: 20
      auto-match-per-week: 1
      rewinds-per-day: 0
    plus:
      photo-comments-per-day: 25
      likes-per-day: 100
      auto-match-per-week: 3
      rewinds-per-day: 5
    premium:
      photo-comments-per-day: 100
      likes-per-day: -1          # -1 = unlimited
      auto-match-per-day: 1
      rewinds-per-day: -1

  chat:
    # A new match may send at most N messages before the other side replies.
    opener-message-limit: 3
    max-message-length: 2000

  rate-limit:
    enabled: true
    default-capacity: 120
    default-refill-period: 1m

logging:
  level:
    root: INFO
    com.dating.platform: ${APP_LOG_LEVEL:DEBUG}
