spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      connection-timeout: 20000
  jpa:
    show-sql: false

server:
  forward-headers-strategy: framework

app:
  seed-demo-data: false
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN}

logging:
  level:
    com.dating.platform: INFO
