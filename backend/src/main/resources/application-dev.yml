spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dating_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  seed-demo-data: true
