spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dating_platform}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.seed-demo-data=true

# Overrides the base list in application.properties - a list property is replaced, not
# merged, so localhost has to be repeated here.
#
# The LAN entry is what lets a phone on the same Wi-Fi talk to the API: the browser
# sends Origin: http://<lan-ip>:3000, and an origin that is not on this list is
# rejected before the request reaches a controller. Change DEV_LAN_ORIGIN if your IP
# moves.
#
# The https entries are for testing calls on a phone: iOS only exposes the camera and
# microphone to secure pages, so the frontend has to be served over HTTPS
# (npm run dev:https, or a cloudflared/ngrok tunnel) - see the frontend README.
#
# The two *:3000 patterns accept the dev frontend under ANY host name or IP (a phone may
# reach this machine by a different address than the one written here). A rejected origin
# gets a plain-text 403, which the app can only report as an unreadable response.
app.cors.allowed-origins=\
  http://*:3000,\
  https://*:3000,\
  http://localhost:3000,\
  http://127.0.0.1:3000,\
  https://localhost:3000,\
  ${DEV_LAN_ORIGIN:http://192.168.1.3:3000},\
  ${DEV_LAN_ORIGIN_HTTPS:https://192.168.1.3:3000},\
  https://*.trycloudflare.com,\
  https://*.ngrok-free.app

# Photo URLs are built from this and then STORED in the database, so a row written
# while this said "localhost" keeps pointing at localhost forever. If you change it,
# existing rows need updating too - see the UPDATE in the README notes.
app.storage.public-base-url=${STORAGE_PUBLIC_URL:http://192.168.1.3:8080/api/v1/media/files}
